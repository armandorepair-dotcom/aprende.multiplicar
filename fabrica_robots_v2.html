<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Fábrica de Robots</title>
    <!-- PeerJS para Multijugador P2P -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --primary: #0f3460;
            --accent: #e94560;
            --text: #ffffff;
            --correct: #4CAF50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background-color: var(--bg-color); color: var(--text); overflow: hidden; display: flex; flex-direction: column; height: 100vh; touch-action: none; }

        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; padding: 20px; text-align: center; }
        .screen.active { display: flex; }

        h1, h2 { margin-bottom: 20px; color: var(--accent); }
        button { background-color: var(--accent); color: white; border: none; padding: 15px 30px; margin: 10px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .btn-table { padding: 15px; font-size: 1.5rem; background-color: var(--primary); }
        .btn-table.selected { background-color: var(--correct); box-shadow: 0 0 10px var(--correct); }

        input { padding: 15px; font-size: 1.2rem; border-radius: 8px; border: none; margin-bottom: 10px; text-align: center; width: 100%; max-width: 300px; }

        /* ---------- Área de juego ---------- */
        #game-area { width: 100%; max-width: 600px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; position: relative; }

        .stats-bar { display: flex; justify-content: space-between; width: 100%; padding: 10px; background: var(--panel-bg); border-radius: 10px; font-size: 1.2rem; font-weight: bold; }

        /* ---------- Banda transportadora ---------- */
        .conveyor-belt {
            position: relative; width: 100%; height: 50vh;
            display: flex; justify-content: center; align-items: flex-end;
            overflow: hidden; border-radius: 14px;
            background: linear-gradient(to bottom, #222f55 0%, #141b33 100%);
            border: 2px solid #2a3b66;
        }
        /* paneles de la pared de la fábrica */
        .conveyor-belt::before {
            content: ''; position: absolute; inset: 0;
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 70px),
                repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 70px);
            pointer-events: none;
        }
        .gear { position: absolute; font-size: 56px; opacity: .13; animation: spin 14s linear infinite; pointer-events: none; }
        .gear.g1 { top: 8px; left: 10px; }
        .gear.g2 { top: 30px; right: 14px; font-size: 80px; animation-direction: reverse; animation-duration: 20s; }
        .gear.g3 { top: 90px; left: 38%; font-size: 36px; animation-duration: 9s; }

        .belt {
            position: absolute; left: 0; right: 0; bottom: 22px; height: 26px; z-index: 1;
            background: repeating-linear-gradient(90deg, #2c2c2c 0, #2c2c2c 16px, #565656 16px, #565656 20px);
            border-top: 3px solid #8a8a8a;
            box-shadow: inset 0 -8px 10px rgba(0,0,0,.55);
            animation: beltMove .5s linear infinite;
            animation-play-state: paused;
        }
        .belt-frame {
            position: absolute; left: 0; right: 0; bottom: 0; height: 22px; z-index: 1;
            background: #1b1b1f; display: flex; justify-content: space-around; align-items: center;
            border-top: 2px solid #000;
        }
        .belt-frame::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
            background: repeating-linear-gradient(45deg, #f6c90e 0 8px, #222 8px 16px);
        }
        .roller {
            width: 18px; height: 18px; border-radius: 50%; margin-bottom: 4px;
            border: 3px solid #9a9a9a;
            background: conic-gradient(#666 0 25%, #222 0 50%, #666 0 75%, #222 0);
            animation: spin .6s linear infinite; animation-play-state: paused;
        }
        .conveyor-belt.moving .belt,
        .conveyor-belt.moving .roller { animation-play-state: running; }

        /* ---------- Robot ---------- */
        .robot {
            position: relative; z-index: 2;
            height: min(36vh, 250px); aspect-ratio: 100 / 138; width: auto;
            margin-bottom: 44px; overflow: visible;
            transform-origin: 50% 100%;
            transition: filter .4s;
        }
        .robot.hover { filter: drop-shadow(0 0 12px #4df); }
        .robot.alive { filter: drop-shadow(0 0 16px rgba(0,255,190,.75)); }

        .robot.enter { animation: robotIn .9s cubic-bezier(.2,.8,.3,1); }
        .robot.leave { animation: robotOut .75s cubic-bezier(.6,0,.9,.5) forwards; }
        .robot.alive { animation: hop .7s ease-out; }
        .robot.error { animation: shake .4s; }

        /* Cuerpo: apagado = gris y opaco, encendido = a todo color */
        .robot-body { transition: filter .8s ease; }
        .robot.off .robot-body { filter: grayscale(.95) brightness(.7); }

        /* Ojos */
        .eye { fill: #12233f; transition: fill .15s; transform-box: fill-box; transform-origin: center; }
        .glint { fill: #fff; opacity: 0; transition: opacity .3s; }
        .robot.alive .eye { fill: #00f0ff; filter: drop-shadow(0 0 3px #0ff); animation: boot .9s, blink 3.6s 1.2s infinite; }
        .robot.alive .glint { opacity: .85; }
        .robot.error .eye { fill: #ff3b3b; filter: drop-shadow(0 0 4px #f00); }

        .mouth { fill: #1a2438; transition: fill .4s; }
        .robot.alive .mouth { fill: #00f0ff; }

        .bulb { fill: #4a1010; transition: fill .3s; }
        .robot.alive .bulb { fill: #ff3b3b; filter: drop-shadow(0 0 4px #f33); animation: bulbBlink .45s infinite alternate; }

        .led { fill: #243; }
        .robot.alive .led { fill: #3fff8f; filter: drop-shadow(0 0 3px #3f8); animation: bulbBlink .3s 4 alternate; }

        .slot { fill: #05080f; stroke: #f5b800; stroke-width: 1.2; transition: fill .3s, stroke .3s; }
        .robot.alive .slot { fill: #3fff8f; stroke: #aaffd0; filter: drop-shadow(0 0 5px #3f8); }

        /* Pantalla del pecho (la ecuación siempre se ve) */
        .screen-chest { fill: #02130b; }
        .text-chest { fill: #5dffa5; font-family: 'Courier New', monospace; font-weight: bold; }
        .robot.alive .text-chest { filter: drop-shadow(0 0 2px #3f9); }
        .robot.alive .screen-chest { animation: screenFlash .8s; }

        /* Brazos celebrando */
        .arm-l, .arm-r { transform-origin: 50px 62px; }
        .arm-l { transform-origin: 14px 62px; }
        .arm-r { transform-origin: 86px 62px; }
        .robot.alive .arm-l { animation: cheerL .7s 2 alternate ease-in-out; }
        .robot.alive .arm-r { animation: cheerR .7s 2 alternate ease-in-out; }

        /* Chispas y onda expansiva */
        .spark { opacity: 0; stroke: #ffe14d; stroke-width: 1.8; stroke-linecap: round; }
        .robot.alive .spark { animation: sparkFly .7s ease-out; }
        .shock { fill: none; stroke: #4ff; stroke-width: 1.6; opacity: 0; }
        .robot.alive .shock { animation: shock .9s ease-out; }

        /* ---------- Pilas ---------- */
        .batteries-container { display: flex; justify-content: space-evenly; width: 100%; padding: 20px 5px; background: var(--panel-bg); border-radius: 20px 20px 0 0; gap: 5px; }
        .battery {
            width: 68px; height: 92px; border-radius: 10px;
            background: linear-gradient(160deg, #fff4a0 0%, #ffd23f 45%, #f09a00 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: #2a1a00; font-weight: bold; text-shadow: 0 1px 0 rgba(255,255,255,.6);
            border: 3px solid #a86a00; box-shadow: 0 8px 0 #a86a00, 0 0 12px rgba(255,210,63,.35);
            position: relative; cursor: grab; touch-action: none; z-index: 10;
        }
        .battery::before { content: ''; position: absolute; top: -10px; left: 50%; margin-left: -15px; width: 30px; height: 8px; background: linear-gradient(#ddd, #888); border-radius: 5px 5px 0 0; }
        .battery::after { content: ''; position: absolute; top: 6px; left: 6px; width: 8px; height: 60%; background: rgba(255,255,255,.45); border-radius: 6px; }

        /* Estado de arrastre: la pila se mueve solo con transform, centrada en el dedo */
        .battery.dragging { z-index: 100; cursor: grabbing; box-shadow: 0 20px 30px rgba(0,0,0,.5), 0 0 18px rgba(255,230,100,.8); }

        .podium { width: 100%; max-width: 500px; background: var(--panel-bg); padding: 20px; border-radius: 15px; }
        .podium-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #444; }
        .podium-item:first-child { font-size: 1.5rem; color: gold; font-weight: bold; }

        /* ---------- Animaciones ---------- */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes beltMove { from { background-position-x: 0; } to { background-position-x: 20px; } }
        @keyframes robotIn { from { transform: translateX(-120vw); } to { transform: translateX(0); } }
        @keyframes robotOut { from { transform: translateX(0); } to { transform: translateX(120vw); } }
        @keyframes hop {
            0%   { transform: translateY(0) scale(1, 1); }
            20%  { transform: translateY(0) scale(1.08, .9); }
            45%  { transform: translateY(-22px) scale(.95, 1.08); }
            70%  { transform: translateY(0) scale(1.05, .95); }
            100% { transform: translateY(0) scale(1, 1); }
        }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-10px); } 100% { transform: translateX(0); } }
        @keyframes boot { 0% { opacity: 0; } 10% { opacity: 1; } 20% { opacity: .15; } 32% { opacity: 1; } 46% { opacity: .3; } 60%, 100% { opacity: 1; } }
        @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
        @keyframes bulbBlink { from { opacity: .35; } to { opacity: 1; } }
        @keyframes screenFlash { 0%, 100% { fill: #02130b; } 30% { fill: #1aff8a; } }
        @keyframes cheerL { from { transform: rotate(0); } to { transform: rotate(38deg); } }
        @keyframes cheerR { from { transform: rotate(0); } to { transform: rotate(-38deg); } }
        @keyframes sparkFly {
            0%   { opacity: 1; transform: rotate(var(--a)) translateX(10px) scaleX(.2); }
            100% { opacity: 0; transform: rotate(var(--a)) translateX(58px) scaleX(1); }
        }
        @keyframes shock {
            0%   { opacity: .9; transform: scale(.2); }
            100% { opacity: 0; transform: scale(7); }
        }
    </style>
</head>
<body>

    <!-- Menú Principal -->
    <div id="screen-menu" class="screen active">
        <h1>🤖 La Fábrica de Robots</h1>
        <h3>1. Elige una Tabla</h3>
        <div class="grid" id="table-grid">
            <!-- Botones generados por JS -->
        </div>
        <button id="btn-salteado" class="btn-table" style="grid-column: span 4;">🎲 Salteado (2-10)</button>

        <h3 style="margin-top:20px;">2. Elige el Modo</h3>
        <button onclick="app.initSinglePlayer()">👤 Un Jugador (Entrenamiento)</button>
        <button onclick="app.showScreen('screen-lobby')">🌐 Multijugador (Competencia)</button>
    </div>

    <!-- Lobby Multijugador -->
    <div id="screen-lobby" class="screen">
        <h2>Modo Multijugador P2P</h2>
        <input type="text" id="player-name" placeholder="Tu Nombre">

        <div style="background: var(--panel-bg); padding: 20px; border-radius: 10px; margin: 10px;">
            <h3>Crear Partida (Host)</h3>
            <label>Rondas (1-5): <input type="number" id="mp-rounds" value="1" min="1" max="5" style="width:60px;"></label><br>
            <button onclick="app.mp.hostGame()">Crear Sala</button>
            <h3 id="room-code-display" style="color:var(--correct); margin-top:10px;"></h3>
        </div>

        <div style="background: var(--panel-bg); padding: 20px; border-radius: 10px; margin: 10px;">
            <h3>Unirse a Partida (Cliente)</h3>
            <input type="text" id="room-code-input" placeholder="Código de la Sala" style="text-transform: uppercase;">
            <button onclick="app.mp.joinGame()">Conectar</button>
        </div>

        <div id="mp-players-list"></div>
        <button id="btn-start-mp" style="display:none;" onclick="app.mp.startGame()">Comenzar Partida</button>
        <button onclick="app.showScreen('screen-menu')" style="background:gray;">Volver</button>
    </div>

    <!-- Pantalla de Juego -->
    <div id="screen-game" class="screen">
        <div id="game-area">
            <div class="stats-bar">
                <span id="stat-score">Aciertos: 0 / 10</span>
                <span id="stat-time">00:00</span>
                <span id="mp-indicator" style="color: gold; display: none;">🏆 Torneo</span>
            </div>

            <div class="conveyor-belt" id="drop-zone">
                <span class="gear g1">⚙️</span>
                <span class="gear g2">⚙️</span>
                <span class="gear g3">⚙️</span>

                <svg class="robot off" id="robot-svg" viewBox="0 0 100 138">
                    <defs>
                        <linearGradient id="gHead" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#9dbcff"/><stop offset="1" stop-color="#4a68c8"/>
                        </linearGradient>
                        <linearGradient id="gTorso" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#ffb070"/><stop offset="1" stop-color="#e2582a"/>
                        </linearGradient>
                        <linearGradient id="gLimb" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0" stop-color="#e3eaf7"/><stop offset=".5" stop-color="#a9b6cf"/><stop offset="1" stop-color="#6f7d99"/>
                        </linearGradient>
                        <linearGradient id="gFoot" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#6b7a99"/><stop offset="1" stop-color="#2f3a52"/>
                        </linearGradient>
                    </defs>

                    <!-- Sombra en la banda -->
                    <ellipse cx="50" cy="134" rx="30" ry="3.2" fill="rgba(0,0,0,.4)"/>

                    <!-- Partes del cuerpo (se ven grises cuando está apagado) -->
                    <g class="robot-body">
                        <!-- Piernas y pies -->
                        <rect x="31" y="108" width="13" height="18" rx="3" fill="url(#gLimb)" stroke="#47536e" stroke-width=".8"/>
                        <rect x="56" y="108" width="13" height="18" rx="3" fill="url(#gLimb)" stroke="#47536e" stroke-width=".8"/>
                        <rect x="26" y="123" width="23" height="10" rx="5" fill="url(#gFoot)" stroke="#222b3d" stroke-width=".8"/>
                        <rect x="51" y="123" width="23" height="10" rx="5" fill="url(#gFoot)" stroke="#222b3d" stroke-width=".8"/>

                        <!-- Brazos -->
                        <g class="arm-l">
                            <rect x="5" y="60" width="12" height="34" rx="6" fill="url(#gLimb)" stroke="#47536e" stroke-width=".8"/>
                            <circle cx="11" cy="97" r="6" fill="url(#gFoot)" stroke="#222b3d" stroke-width=".8"/>
                        </g>
                        <g class="arm-r">
                            <rect x="83" y="60" width="12" height="34" rx="6" fill="url(#gLimb)" stroke="#47536e" stroke-width=".8"/>
                            <circle cx="89" cy="97" r="6" fill="url(#gFoot)" stroke="#222b3d" stroke-width=".8"/>
                        </g>

                        <!-- Antena -->
                        <line x1="50" y1="17" x2="50" y2="7" stroke="#aab4c8" stroke-width="2.4" stroke-linecap="round"/>

                        <!-- Orejas -->
                        <rect x="21" y="28" width="7" height="15" rx="2.5" fill="url(#gLimb)" stroke="#47536e" stroke-width=".8"/>
                        <rect x="72" y="28" width="7" height="15" rx="2.5" fill="url(#gLimb)" stroke="#47536e" stroke-width=".8"/>

                        <!-- Cabeza -->
                        <rect x="27" y="16" width="46" height="35" rx="10" fill="url(#gHead)" stroke="#2a3b7a" stroke-width="1.2"/>
                        <rect x="31" y="18" width="38" height="4" rx="2" fill="#fff" opacity=".28"/>
                        <rect x="32" y="23" width="36" height="18" rx="8" fill="#0b1530" stroke="#b7c8ee" stroke-width=".9"/>

                        <!-- Cuello -->
                        <rect x="43" y="50" width="14" height="7" rx="1.5" fill="#4c566b"/>
                        <line x1="43" y1="52.5" x2="57" y2="52.5" stroke="#2c3446" stroke-width=".8"/>
                        <line x1="43" y1="55" x2="57" y2="55" stroke="#2c3446" stroke-width=".8"/>

                        <!-- Hombros -->
                        <circle cx="17" cy="64" r="6" fill="url(#gFoot)" stroke="#222b3d" stroke-width=".8"/>
                        <circle cx="83" cy="64" r="6" fill="url(#gFoot)" stroke="#222b3d" stroke-width=".8"/>

                        <!-- Torso -->
                        <rect x="18" y="56" width="64" height="54" rx="12" fill="url(#gTorso)" stroke="#8c2f10" stroke-width="1.2"/>
                        <rect x="24" y="58" width="52" height="3" rx="1.5" fill="#fff" opacity=".3"/>
                        <circle cx="24" cy="63" r="1.7" fill="#7b2a0f"/>
                        <circle cx="76" cy="63" r="1.7" fill="#7b2a0f"/>
                        <circle cx="24" cy="104" r="1.7" fill="#7b2a0f"/>
                        <circle cx="76" cy="104" r="1.7" fill="#7b2a0f"/>
                        <!-- Cinturón -->
                        <rect x="18" y="106" width="64" height="4" fill="#5b2008" opacity=".45"/>
                    </g>

                    <!-- Antena (bombilla), ojos y boca (brillan al encender) -->
                    <circle class="bulb" cx="50" cy="5.5" r="4"/>
                    <circle class="eye" cx="42" cy="32" r="4.4"/>
                    <circle class="eye" cx="58" cy="32" r="4.4"/>
                    <circle class="glint" cx="43.4" cy="30.6" r="1.1"/>
                    <circle class="glint" cx="59.4" cy="30.6" r="1.1"/>
                    <rect class="mouth" x="42" y="45" width="16" height="2.6" rx="1.3"/>

                    <!-- Pantalla del pecho: ecuación centrada -->
                    <rect x="23" y="63" width="54" height="30" rx="6" fill="#0d1b2a" stroke="#8aa0c6" stroke-width="1.1"/>
                    <rect class="screen-chest" x="25.5" y="65.5" width="49" height="25" rx="4"/>
                    <text class="text-chest" id="robot-text" x="50" y="78.5" text-anchor="middle" dominant-baseline="central" font-size="15">7 x 8</text>
                    <path d="M27 67 H60 L55 70 H27 Z" fill="#fff" opacity=".07"/>

                    <!-- Ranura de la pila y luces -->
                    <rect class="slot" id="robot-slot" x="36" y="97.5" width="28" height="8" rx="3"/>
                    <circle class="led" cx="26" cy="101.5" r="2"/>
                    <circle class="led" cx="74" cy="101.5" r="2"/>

                    <!-- Efectos de encendido -->
                    <g transform="translate(50,80)">
                        <circle class="shock" cx="0" cy="0" r="10"/>
                        <g class="spark" style="--a:0deg"><line x1="0" y1="0" x2="9" y2="0"/></g>
                        <g class="spark" style="--a:45deg"><line x1="0" y1="0" x2="9" y2="0"/></g>
                        <g class="spark" style="--a:90deg"><line x1="0" y1="0" x2="9" y2="0"/></g>
                        <g class="spark" style="--a:135deg"><line x1="0" y1="0" x2="9" y2="0"/></g>
                        <g class="spark" style="--a:180deg"><line x1="0" y1="0" x2="9" y2="0"/></g>
                        <g class="spark" style="--a:225deg"><line x1="0" y1="0" x2="9" y2="0"/></g>
                        <g class="spark" style="--a:270deg"><line x1="0" y1="0" x2="9" y2="0"/></g>
                        <g class="spark" style="--a:315deg"><line x1="0" y1="0" x2="9" y2="0"/></g>
                    </g>
                </svg>

                <!-- Banda -->
                <div class="belt"></div>
                <div class="belt-frame">
                    <span class="roller"></span><span class="roller"></span><span class="roller"></span>
                    <span class="roller"></span><span class="roller"></span><span class="roller"></span>
                    <span class="roller"></span><span class="roller"></span><span class="roller"></span>
                    <span class="roller"></span><span class="roller"></span><span class="roller"></span>
                </div>
            </div>

            <h3 id="mp-winner-announcement" style="color:var(--correct); height: 30px;"></h3>

            <div class="batteries-container" id="batteries-box">
                <!-- Generado por JS -->
            </div>
        </div>
    </div>

    <!-- Resultados -->
    <div id="screen-results" class="screen">
        <h1>🏁 Reporte de Fábrica</h1>
        <div class="podium" id="results-content">
            <!-- Inyectado por JS -->
        </div>
        <button onclick="app.showScreen('screen-menu')">Volver al Menú</button>
    </div>

    <!-- Logica Principal -->
    <script>
        const app = {
            selectedTable: null,
            mode: 'single',
            busy: false,
            beltTimer: null,
            game: { attempts: 0, maxAttempts: 10, hits: 0, fails: 0, startTime: 0, timerInterval: null, currentCorrect: 0, currentQuestion: '' },
            mp: { peer: null, conn: null, connections: [], isHost: false, players: {}, round: 1, maxRounds: 1 }
        };

        // --- INICIALIZACIÓN ---
        function initApp() {
            const grid = document.getElementById('table-grid');
            for(let i = 2; i <= 10; i++) {
                let b = document.createElement('button');
                b.className = 'btn-table';
                b.innerText = i;
                b.onclick = () => selectTabla(i, b);
                grid.appendChild(b);
            }
            document.getElementById('btn-salteado').onclick = (e) => selectTabla('random', e.target);
            selectTabla(2, grid.firstChild); // Default

            // Limpia las clases de animación de un solo uso cuando terminan
            const robot = document.getElementById('robot-svg');
            robot.addEventListener('animationend', (e) => {
                if (e.target !== robot) return;
                if (e.animationName === 'robotIn') robot.classList.remove('enter');
                if (e.animationName === 'shake') robot.classList.remove('error');
            });
        }

        function selectTabla(t, btn) {
            app.selectedTable = t;
            document.querySelectorAll('.btn-table').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        app.showScreen = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        // --- SISTEMA DE PREGUNTAS ---
        function generateQuestion() {
            let t = app.selectedTable === 'random' ? Math.floor(Math.random() * 9) + 2 : parseInt(app.selectedTable);
            let m = Math.floor(Math.random() * 9) + 2; // 2 al 10
            let ans = t * m;

            let options = [ans];

            while(options.length < 4) {
                let offset = Math.floor(Math.random() * 20) - 10;
                if(offset === 0) offset = 5;
                let fake = ans + offset;

                if(fake > 0 && !options.includes(fake)) {
                    options.push(fake);
                }
            }

            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }

            return { text: `${t} x ${m}`, ans: ans, opts: options };
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance(text.replace('x', 'por'));
                utterance.lang = 'es-MX';
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- EFECTOS DEL ROBOT Y LA BANDA ---
        function beltRun(ms) {
            const belt = document.getElementById('drop-zone');
            belt.classList.add('moving');
            clearTimeout(app.beltTimer);
            app.beltTimer = setTimeout(() => belt.classList.remove('moving'), ms);
        }

        // El robot "cobra vida": ojos, pantalla, luces, chispas y salto
        function lifeRobot() {
            const robot = document.getElementById('robot-svg');
            robot.classList.remove('off', 'enter', 'error', 'hover');
            void robot.getBoundingClientRect();
            robot.classList.add('alive');
        }

        // El robot sale por la derecha sobre la banda
        function robotLeave() {
            const robot = document.getElementById('robot-svg');
            robot.classList.remove('hover');
            robot.classList.add('leave');
            beltRun(850);
        }

        function robotError() {
            const robot = document.getElementById('robot-svg');
            robot.classList.remove('error');
            void robot.getBoundingClientRect();
            robot.classList.add('error');
        }

        // --- MODO UN JUGADOR ---
        app.initSinglePlayer = () => {
            app.mode = 'single';
            app.busy = false;
            clearInterval(app.game.timerInterval);
            app.game = { attempts: 0, maxAttempts: 10, hits: 0, fails: 0, startTime: Date.now() };
            document.getElementById('mp-indicator').style.display = 'none';
            document.getElementById('stat-time').style.display = '';
            document.getElementById('stat-score').style.display = '';
            app.showScreen('screen-game');
            startTimer();
            nextRobot();
        };

        function startTimer() {
            clearInterval(app.game.timerInterval);
            app.game.timerInterval = setInterval(() => {
                let diff = Math.floor((Date.now() - app.game.startTime) / 1000);
                let m = String(Math.floor(diff / 60)).padStart(2, '0');
                let s = String(diff % 60).padStart(2, '0');
                document.getElementById('stat-time').innerText = `${m}:${s}`;
            }, 1000);
        }

        function nextRobot() {
            if(app.mode === 'single' && app.game.attempts >= app.game.maxAttempts) return endSinglePlayer();

            let q = generateQuestion();
            app.game.currentCorrect = q.ans;
            app.game.currentQuestion = q.text;

            renderRobot(q);
            if(app.mode === 'single') speak(q.text);
        }

        function renderRobot(q) {
            const robot = document.getElementById('robot-svg');
            // Robot nuevo: apagado y entrando por la izquierda sobre la banda
            robot.classList.remove('alive', 'leave', 'error', 'hover', 'enter', 'off');
            void robot.getBoundingClientRect();
            robot.classList.add('off', 'enter');
            beltRun(950);
            app.busy = false;

            // Ecuación centrada en la pantalla del pecho; el tamaño se ajusta al largo
            const txt = document.getElementById('robot-text');
            txt.textContent = q.text;
            txt.setAttribute('font-size', q.text.length <= 5 ? 15 : 11);

            const box = document.getElementById('batteries-box');
            box.innerHTML = '';
            q.opts.forEach(opt => {
                let bat = document.createElement('div');
                bat.className = 'battery';
                bat.innerText = opt;

                if (app.mode === 'single') {
                    setupDragAndDrop(bat, opt);
                } else {
                    bat.onclick = () => {
                        if (opt !== app.game.currentCorrect) robotError();
                        app.mp.sendAnswer(opt);
                    };
                }
                box.appendChild(bat);
            });

            if (app.mode === 'single') {
                document.getElementById('stat-score').innerText = `Robots: ${app.game.attempts} / ${app.game.maxAttempts}`;
            }
        }

        // --- SISTEMA DRAG AND DROP (UN JUGADOR) ---
        // La pila se centra exactamente bajo el dedo y se suelta donde el dedo toque al robot.
        function robotHit(x, y) {
            const r = document.getElementById('robot-svg').getBoundingClientRect();
            const pad = 10;
            return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
        }

        function returnBattery(el) {
            el.style.transition = 'transform .3s cubic-bezier(.2,1.4,.4,1)';
            el.style.transform = 'translate(0px, 0px) scale(1)';
            setTimeout(() => {
                el.classList.remove('dragging');
                el.style.transition = '';
                el.style.transform = '';
            }, 320);
        }

        function setupDragAndDrop(el, value) {
            let dragging = false;
            let cx = 0, cy = 0; // centro de la pila en reposo

            function moveTo(e) {
                const dx = e.clientX - cx;
                const dy = e.clientY - cy;
                el.style.transform = `translate(${dx}px, ${dy}px) scale(1.15)`;
                document.getElementById('robot-svg').classList.toggle('hover', robotHit(e.clientX, e.clientY));
            }

            el.addEventListener('pointerdown', (e) => {
                if (app.busy) return;
                e.preventDefault();
                dragging = true;
                el.setPointerCapture(e.pointerId);
                el.classList.add('dragging');
                el.style.transition = 'none';
                const r = el.getBoundingClientRect();
                cx = r.left + r.width / 2;
                cy = r.top + r.height / 2;
                el._cx = cx; el._cy = cy;
                moveTo(e);
            });

            el.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                e.preventDefault();
                moveTo(e);
            });

            const finish = (e, cancelled) => {
                if (!dragging) return;
                dragging = false;
                document.getElementById('robot-svg').classList.remove('hover');
                if (!cancelled && robotHit(e.clientX, e.clientY)) {
                    checkAnswer(el, value);
                } else {
                    returnBattery(el);
                }
            };
            el.addEventListener('pointerup', (e) => finish(e, false));
            el.addEventListener('pointercancel', (e) => finish(e, true));
        }

        function checkAnswer(el, val) {
            if (val === app.game.currentCorrect) {
                app.busy = true;
                app.game.hits++;

                // La pila viaja a la ranura del pecho, girando para encajar
                const slot = document.getElementById('robot-slot').getBoundingClientRect();
                const dx = (slot.left + slot.width / 2) - el._cx;
                const dy = (slot.top + slot.height / 2) - el._cy;
                el.style.transition = 'transform .25s ease-in, opacity .25s ease-in';
                el.style.transform = `translate(${dx}px, ${dy}px) scale(.3) rotate(90deg)`;

                setTimeout(() => {
                    el.style.opacity = '0';
                    lifeRobot();
                    speak('¡Correcto!');
                }, 260);
                setTimeout(robotLeave, 1250);
                setTimeout(() => {
                    app.game.attempts++;
                    nextRobot();
                }, 2000);
            } else {
                app.game.fails++;
                returnBattery(el);
                robotError();
                speak('Intenta de nuevo');
            }
        }

        function endSinglePlayer() {
            clearInterval(app.game.timerInterval);
            app.showScreen('screen-results');
            const timeStr = document.getElementById('stat-time').innerText;
            const res = document.getElementById('results-content');

            const key = `record_tabla_${app.selectedTable}`;
            const oldRecord = localStorage.getItem(key);
            const scoreNum = (app.game.hits * 100) - (app.game.fails * 10);

            let recordText = '';
            if(!oldRecord || scoreNum > parseInt(oldRecord)) {
                localStorage.setItem(key, scoreNum);
                recordText = `<br><span style="color:gold;">🌟 ¡Nuevo Récord Personal! 🌟</span>`;
            }

            res.innerHTML = `
                <div class="podium-item">Modo Entrenamiento</div>
                <div class="podium-item"><span>Aciertos:</span> <span>${app.game.hits}</span></div>
                <div class="podium-item"><span>Fallas:</span> <span style="color:var(--accent)">${app.game.fails}</span></div>
                <div class="podium-item"><span>Tiempo:</span> <span>${timeStr}</span></div>
                <div style="text-align:center; padding:10px;">${recordText}</div>
            `;
        }

        // --- MOTOR MULTIJUGADOR (PEERJS) ---
       app.mp.hostGame = () => {
    const name = document.getElementById('player-name').value || 'Host';
    const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
    app.mp.isHost = true;
    app.mp.maxRounds = parseInt(document.getElementById('mp-rounds').value) || 1;

    const displayMsg = document.getElementById('room-code-display');
    displayMsg.innerText = "Creando sala...";
    displayMsg.style.color = "orange";

    app.mp.peer = new Peer(`fabrica-${roomCode}`);
    
    app.mp.peer.on('open', (id) => {
        displayMsg.style.color = "var(--correct)";
        displayMsg.innerText = `Código de Sala: ${roomCode}`;
        document.getElementById('btn-start-mp').style.display = 'block';
        app.mp.players[id] = { name: name, score: 0 };
        updateLobbyList();
    });

    app.mp.peer.on('connection', (conn) => {
        // Asegurar que el canal de datos esté completamente abierto antes de agregarlo
        conn.on('open', () => {
            app.mp.connections.push(conn);
            conn.on('data', (data) => handleHostData(conn.peer, data));
        });
    });

    app.mp.peer.on('error', (err) => {
        displayMsg.style.color = "red";
        displayMsg.innerText = "Error al crear la sala. Intenta de nuevo.";
    });
};

        app.mp.joinGame = () => {
    const name = document.getElementById('player-name').value || 'Jugador';
    // .trim() es indispensable para borrar espacios invisibles que pone el celular
    const roomCode = document.getElementById('room-code-input').value.trim().toUpperCase();
    app.mp.isHost = false;

    const displayMsg = document.getElementById('room-code-display');
    displayMsg.innerText = "Conectando a la sala...";
    displayMsg.style.color = "orange";

    app.mp.peer = new Peer();
    
    app.mp.peer.on('open', (id) => {
        // Opción reliable activada para asegurar que no se pierdan los paquetes TCP
        app.mp.conn = app.mp.peer.connect(`fabrica-${roomCode}`, { reliable: true });

        app.mp.conn.on('open', () => {
            displayMsg.style.color = "var(--correct)";
            displayMsg.innerText = `Conectado a: ${roomCode}. Esperando al host...`;
            app.mp.conn.send({ type: 'JOIN', name: name });
            app.mp.conn.on('data', handleClientData);
        });

        app.mp.conn.on('error', (err) => {
            displayMsg.style.color = "red";
            displayMsg.innerText = "Error de conexión con el servidor.";
        });
    });

    app.mp.peer.on('error', (err) => {
        displayMsg.style.color = "red";
        displayMsg.innerText = "Error: No se encontró la sala.";
    });
};

        function updateLobbyList() {
            let html = '<h4>Ingenieros Conectados:</h4>';
            Object.values(app.mp.players).forEach(p => html += `<div>🤖 ${p.name}</div>`);
            document.getElementById('mp-players-list').innerHTML = html;
        }

        function handleHostData(peerId, data) {
            if (data.type === 'JOIN') {
                app.mp.players[peerId] = { name: data.name, score: 0 };
                updateLobbyList();
                broadcast({ type: 'UPDATE_LOBBY', players: app.mp.players });
            }
            if (data.type === 'ANSWER' && !app.mp.roundLocked) {
                if (data.val === app.game.currentCorrect) {
                    app.mp.roundLocked = true;
                    app.mp.players[peerId].score += 10;
                    broadcast({ type: 'WINNER_ROUND', name: app.mp.players[peerId].name, correct: true });
                    handleRoundWinner(app.mp.players[peerId].name);
                }
            }
        }

        function broadcast(msg) {
            app.mp.connections.forEach(c => c.send(msg));
        }

        app.mp.startGame = () => {
            app.mode = 'multi';
            app.game.attempts = 0;
            app.game.maxAttempts = 20;
            app.mp.round = 1;
            broadcast({ type: 'START_GAME', maxAttempts: 20 });
            app.initMultiplayerUI();
            nextMPQuestion();
        };

        function nextMPQuestion() {
            if (app.game.attempts >= app.game.maxAttempts) {
                if(app.mp.round >= app.mp.maxRounds) {
                    broadcast({ type: 'GAME_OVER', players: app.mp.players });
                    endMPGame(app.mp.players);
                    return;
                } else {
                    app.mp.round++;
                    app.game.attempts = 0;
                }
            }
            app.mp.roundLocked = false;
            let q = generateQuestion();
            app.game.currentCorrect = q.ans;
            broadcast({ type: 'NEW_QUESTION', q: q, round: app.mp.round, attempt: app.game.attempts });
            renderMPQuestion(q, app.mp.round);
        }

        function handleRoundWinner(name) {
            document.getElementById('mp-winner-announcement').innerText = `¡${name} acertó!`;
            lifeRobot();
            setTimeout(robotLeave, 1100);
            setTimeout(() => {
                document.getElementById('mp-winner-announcement').innerText = '';
                app.game.attempts++;
                if(app.mp.isHost) nextMPQuestion();
            }, 1900);
        }

        function handleClientData(data) {
            if (data.type === 'UPDATE_LOBBY') {
                app.mp.players = data.players;
                updateLobbyList();
            }
            if (data.type === 'START_GAME') {
                app.mode = 'multi';
                app.game.attempts = 0;
                app.initMultiplayerUI();
            }
            if (data.type === 'NEW_QUESTION') {
                app.game.currentCorrect = data.q.ans;
                if (typeof data.attempt === 'number') app.game.attempts = data.attempt;
                renderMPQuestion(data.q, data.round);
            }
            if (data.type === 'WINNER_ROUND') {
                handleRoundWinner(data.name);
            }
            if (data.type === 'GAME_OVER') {
                endMPGame(data.players);
            }
        }

        app.initMultiplayerUI = () => {
            app.showScreen('screen-game');
            document.getElementById('stat-time').style.display = 'none';
            document.getElementById('stat-score').style.display = 'none';
            document.getElementById('mp-indicator').style.display = 'block';
        };

        function renderMPQuestion(q, round) {
            document.getElementById('mp-indicator').innerText = `🏆 Ronda ${round} - Robot ${app.game.attempts + 1}`;
            renderRobot(q);
            speak(q.text);
        }

        app.mp.sendAnswer = (val) => {
            if (app.mp.isHost) {
                if (!app.mp.roundLocked && val === app.game.currentCorrect) {
                    app.mp.roundLocked = true;
                    app.mp.players[app.mp.peer.id].score += 10;
                    broadcast({ type: 'WINNER_ROUND', name: app.mp.players[app.mp.peer.id].name, correct: true });
                    handleRoundWinner(app.mp.players[app.mp.peer.id].name);
                }
            } else {
                app.mp.conn.send({ type: 'ANSWER', val: val });
            }
        };

        function endMPGame(players) {
            app.showScreen('screen-results');
            const res = document.getElementById('results-content');
            const sorted = Object.values(players).sort((a, b) => b.score - a.score);

            let html = '<div style="text-align:center; font-size:1.2rem; margin-bottom:15px;">Resultados Multijugador</div>';
            const medals = ['🥇 1er Lugar', '🥈 2do Lugar', '🥉 3er Lugar', '4to Lugar', '5to Lugar'];

            sorted.forEach((p, i) => {
                html += `
                    <div class="podium-item" style="${i===0 ? 'color:gold; font-size:1.5rem;' : ''}">
                        <span>${medals[i] || (i+1)+'º'}: ${p.name}</span>
                        <span>${p.score} pts</span>
                    </div>
                `;
            });
            res.innerHTML = html;
        }

        // --- GENERACIÓN E INYECCIÓN DEL SERVICE WORKER (PWA OFFLINE) ---
        const swCode = `
            const CACHE_NAME = 'fabrica-robots-v4';
            self.addEventListener('install', e => {
                e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll([location.href])));
                self.skipWaiting();
            });
            self.addEventListener('activate', e => {
                e.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', e => {
                e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
            });
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl).then(() => console.log("PWA Offline activa.")).catch(() => {});
        }

        window.onload = initApp;

    </script>
